<!DOCTYPE html>
<html>
<head>
  <title>Employee Management</title>
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    /* Added some basic styling for the bulk actions */
    .bulk-actions { margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
    .editable-input { width: 90%; padding: 4px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Employee Management</h1>

    <div class="card">
      <h2>Live Time (Australia)</h2>
      <div id="time">Loading...</div>
    </div>

    <div class="card">
      <h2>Employees</h2>
      
      <div class="bulk-actions">
        <button onclick="bulkDelete()" style="background-color: #ff4d4d; color: white;">Delete Selected</button>
        <button onclick="bulkUpdate()" style="background-color: #4CAF50; color: white;">Save All Edits</button>
      </div>

      <table id="table">
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
            <th>ID</th>
            <th>Name</th>
            <th>Role</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card">
       <h3>Add Employee</h3>
       <div class="form-row">
         <input id="id" placeholder="ID">
         <input id="name" placeholder="Name">
         <input id="role" placeholder="Role">
       </div>
       <button onclick="addEmployee()">Add</button>
     </div>
 
     <div class="card">
       <h3>Upload CSV</h3>
       <input type="file" id="uploadFile">
       <button onclick="upload()">Upload</button>
       <progress id="uploadProgress" value="0" max="100"></progress>
     </div>
 
     <div class="card">
       <h3>Download CSV</h3>
       <button onclick="download()">Download</button>
       <progress id="downloadProgress" value="0" max="100"></progress>
     </div>
  </div>

  <script>
    // --- Existing & New Functions ---

    async function loadEmployees() {
      const res = await fetch("/employees");
      const data = await res.json();
      const tbody = document.querySelector("tbody");
      tbody.innerHTML = "";
      
      data.forEach(raw => {
        const e = {
          id: raw.id || raw.Id || raw.ID || "",
          name: raw.name || raw.Name || raw.NAME || "",
          role: raw.role || raw.Role || raw.ROLE || ""
        };
        
        // Rows are now created with checkboxes and editable spans/inputs
        tbody.innerHTML += `
          <tr data-id="${e.id}">
            <td><input type="checkbox" class="row-checkbox"></td>
            <td>${e.id}</td>
            <td><input type="text" class="edit-name editable-input" value="${e.name}"></td>
            <td><input type="text" class="edit-role editable-input" value="${e.role}"></td>
          </tr>`;
      });
    }

    function toggleSelectAll(source) {
      const checkboxes = document.querySelectorAll('.row-checkbox');
      checkboxes.forEach(cb => cb.checked = source.checked);
    }

    // BULK DELETE
    async function bulkDelete() {
      const selectedIds = [];
      document.querySelectorAll('.row-checkbox:checked').forEach(cb => {
        selectedIds.push(cb.closest('tr').getAttribute('data-id'));
      });

      if (selectedIds.length === 0) return alert("Select rows to delete");

      if (confirm(`Delete ${selectedIds.length} employees?`)) {
        await fetch("/employees/bulk-delete", {
          method: "POST", // Or DELETE depending on your API design
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ids: selectedIds })
        });
        loadEmployees();
      }
    }

    // BULK UPDATE (EDIT)
    async function bulkUpdate() {
      const updates = [];
      document.querySelectorAll('tbody tr').forEach(row => {
        updates.push({
          id: row.getAttribute('data-id'),
          name: row.querySelector('.edit-name').value,
          role: row.querySelector('.edit-role').value
        });
      });

      await fetch("/employees/bulk-update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ employees: updates })
      });
      alert("Changes saved!");
      loadEmployees();
    }

    // ... (Keep your addEmployee, upload, download, and socket code here) ...
    loadEmployees();

    async function addEmployee() {
       const idEl = document.getElementById("id");
       const nameEl = document.getElementById("name");
       const roleEl = document.getElementById("role");
       const payload = {
         id: idEl ? idEl.value.trim() : "",
         name: nameEl ? nameEl.value.trim() : "",
         role: roleEl ? roleEl.value.trim() : ""
       };
       if (!payload.id && !payload.name && !payload.role) {
         alert("Please enter at least one field before adding.");
         return;
       }
       await fetch("/employees", {
         method: "POST",
         headers: { "Content-Type": "application/json" },
         body: JSON.stringify(payload)
       });
       if (idEl) idEl.value = "";
       if (nameEl) nameEl.value = "";
       if (roleEl) roleEl.value = "";
       loadEmployees();
     }
 
     function upload() {
       const file = uploadFile.files[0];
       const xhr = new XMLHttpRequest();
       xhr.open("POST", "/upload");
       xhr.upload.onprogress = e =>
         uploadProgress.value = (e.loaded / e.total) * 100;
       const form = new FormData();
       form.append("file", file);
       xhr.send(form);
     }
 
     async function download() {
       const res = await fetch("/download");
       const reader = res.body.getReader();
       const lenHeader = res.headers.get("content-length") || res.headers.get("Content-Length");
       const len = lenHeader ? parseInt(lenHeader, 10) : NaN;
       let received = 0;
       const chunks = [];
       const progressEl = document.getElementById("downloadProgress");
 
       if (!isFinite(len) || len <= 0) {
         progressEl.removeAttribute("value");
       } else {
         progressEl.max = 100;
         progressEl.value = 0;
       }
 
       while (true) {
         const { done, value } = await reader.read();
         if (done) break;
         chunks.push(value);
         received += value.length;
         if (isFinite(len) && len > 0) {
           progressEl.value = (received / len) * 100;
         }
       }
 
       if (isFinite(len) && len > 0) progressEl.value = 100;
       else progressEl.removeAttribute("value");
 
       const blob = new Blob(chunks);
       const a = document.createElement("a");
       a.href = URL.createObjectURL(blob);
       a.download = "data.csv";
       a.click();
     }
 
     const socket = io();
     socket.on("time", t => time.innerText = t);
  </script>
</body>
</html>
